name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # vite build 產出 dist/client（前端）+ dist/agent_starter（worker bundle),
      # 並寫 .wrangler/deploy/config.json 讓後續 `wrangler deploy` 使用正確資產。
      # 沒有這一步，部署出去的 assets 只有 ./public（favicon）,網頁會 404。
      - name: Build
        run: npm run build

      - name: Apply D1 schema (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # --yes：CI 無互動；CREATE TABLE IF NOT EXISTS 可安全重複執行
        run: npx wrangler d1 execute prod-agent-db --remote --file=./schema.sql --yes

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
